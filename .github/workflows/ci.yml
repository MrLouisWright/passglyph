name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [18, 20, 22] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify ESM import and CJS require
        run: |
          node --input-type=module -e "import { attach, createSalt } from 'passglyph'; import { webcrypto } from 'node:crypto'; if (!attach || createSalt(webcrypto).length !== 28) process.exit(1)"
          node -e "if (typeof require('passglyph').attach !== 'function') process.exit(1)"
      - run: npm pack --dry-run
